services:
  the-internet:
    image: gprestes/the-internet@sha256:0c5f3d11d45264ff6363ed48b769d8a67c9fb2eea39cc0e07ead4f639cdacff1
    ports:
      - "7080:5000"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - "exit(Net::HTTP.get_response(URI('http://127.0.0.1:5000/login')).is_a?(Net::HTTPSuccess) ? 0 : 1)"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
