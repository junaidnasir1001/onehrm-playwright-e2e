name: Playwright Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Public demo tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start The Internet
        run: |
          docker compose up --detach
          if ! ./scripts/wait-for-the-internet.sh; then
            docker compose logs --no-color
            exit 1
          fi

      - name: Run public demo tests
        run: npm run test:demo
        env:
          BASE_URL: http://127.0.0.1:7080
          CI: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            reports/demo-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop The Internet
        if: always()
        run: docker compose down
